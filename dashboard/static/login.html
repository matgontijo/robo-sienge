<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F3;--surf:#fff;--line:#DCE3DD;--ink:#16211B;--mute:#6E7D75;--acc:#1E6B4F;--acc2:#2A8A66;--bad:#B0442B;--bad-soft:#FBE5DF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1512;--surf:#171F1A;--line:#263129;--ink:#E8EDE9;--mute:#8E9C94;--acc:#4FB58C;--acc2:#6CC9A2;--bad:#EB8A70;--bad-soft:#3A2017}}
:root[data-theme="dark"]{--bg:#0F1512;--surf:#171F1A;--line:#263129;--ink:#E8EDE9;--mute:#8E9C94;--acc:#4FB58C;--acc2:#6CC9A2;--bad:#EB8A70;--bad-soft:#3A2017}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;padding:20px}
.card{width:100%;max-width:380px;background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:30px 28px;box-shadow:0 8px 30px -14px rgba(22,33,27,.25)}
.gem{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,var(--acc2),var(--acc));display:grid;place-items:center;color:#fff;font-size:20px;font-weight:800;margin-bottom:14px}
h1{font-size:21px;letter-spacing:-.3px}
p{color:var(--mute);font-size:13.5px;margin:4px 0 20px}
label{display:block;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 5px}
input{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:14.5px}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(30,107,79,.15)}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
button:hover{background:var(--acc2)}
button:disabled{opacity:.5}
.erro{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600}
.rod{margin-top:18px;color:var(--mute);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<form class="card" id="f">
  <div class="gem">G</div>
  <h1>Robô Sienge · Garden</h1>
  <p>Entre com o usuário que o administrador te deu.</p>
  <label>Usuário</label>
  <input id="u" autocomplete="username" autofocus>
  <label>Senha</label>
  <input id="s" type="password" autocomplete="current-password">
  <button id="b">Entrar</button>
  <div class="erro" id="erro"></div>
  <div class="rod">Agente · Conferência · Impostos — Grupo Garden</div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('erro');
  b.disabled = true; e.style.display = 'none';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value.trim(), senha: document.getElementById('s').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || 'Usuário ou senha inválidos');
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') ? next : '/';
  } catch (err) { e.textContent = err.message; e.style.display = 'block'; b.disabled = false; }
});
</script>
</body>
</html>
