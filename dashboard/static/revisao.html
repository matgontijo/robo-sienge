<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conferência | Robô Sienge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
    --ink:#EDEEF0; --muted:#8A8F98; --line:rgba(255,255,255,.07); --bg:#0A0A0B; --card:rgba(255,255,255,.03);
    --ok:#34d399; --ok-bg:rgba(52,211,153,.12);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12);
    --crit:#f87171; --crit-bg:rgba(248,113,113,.12);
    --accent:#14b8a6; --accent-bg:rgba(20,184,166,.12);
    --grupo:#131518;
    --font:"Geist","Geist Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Geist Mono",Consolas,"Cascadia Mono",monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
    font-family:var(--font);
    background:var(--bg); color:var(--ink);
    font-size:14px; line-height:1.5;
    display:flex; flex-direction:column; overflow:hidden;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.14); border-radius:99px; border:2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background:rgba(255,255,255,.24); }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ============ barra de ferramentas (vidro fosco) ============ */
.topo {
    display:flex; align-items:center; gap:12px;
    padding:10px 18px; background:rgba(10,10,11,.75);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    flex-shrink:0; flex-wrap:wrap; position:relative; z-index:10;
}
.topo select { padding:7px 11px; border-radius:8px; border:1px solid var(--line);
    font-size:13px; font-weight:700; background:rgba(255,255,255,.04); color:var(--ink); font-family:inherit; }
.topo select option { background:#131416; color:var(--ink); }
.prog { display:flex; align-items:center; gap:10px; min-width:200px; }
.prog .barra { width:150px; height:8px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
.prog .barra div { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),#6ee7b7); transition:width .4s cubic-bezier(.2,.7,.3,1); box-shadow:0 0 12px rgba(20,184,166,.5); }
.prog .txt { font-size:12.5px; color:var(--muted); white-space:nowrap; }
.prog .txt b { color:var(--ink); }

.filtros { display:flex; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.filtros button { border:none; background:transparent; padding:8px 16px; font-size:12.5px;
    font-weight:600; color:var(--muted); cursor:pointer; border-right:1px solid var(--line);
    transition:background .15s, color .15s; }
.filtros button:last-child { border-right:none; }
.filtros button:hover { background:rgba(255,255,255,.06); color:var(--ink); }
.filtros button.on { background:var(--ink); color:#0A0A0B; font-weight:800; }
.filtros button b { font-weight:800; }
.filtros button.on b { color:#0A0A0B; }
.filtros .fc b { color:var(--crit); }
.filtros .fw b { color:var(--warn); }

#busca { flex:1; min-width:170px; max-width:340px; padding:8px 14px;
    border:1px solid var(--line); border-radius:99px; font-size:13px;
    background:rgba(255,255,255,.04); color:var(--ink); font-family:inherit; }
#busca:focus { border-color:var(--accent); outline:none; box-shadow:0 0 0 3px rgba(20,184,166,.12); }
.topo .acao { border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:9px;
    padding:8px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink); white-space:nowrap;
    transition:border-color .15s, transform .12s; }
.topo .acao:hover { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }

/* ============ área da tabela ============ */
#scroll { flex:1; overflow:auto; padding:0 18px 40px; }
table { width:100%; border-collapse:separate; border-spacing:0; min-width:1080px; }

thead th {
    position:sticky; top:0; z-index:4;
    background:var(--bg);
    text-align:left; font-size:11px; letter-spacing:.9px; text-transform:uppercase;
    color:var(--muted); font-weight:800; padding:14px 14px 8px;
    border-bottom:2px solid rgba(255,255,255,.12);
}
thead th.c { text-align:center; }

/* linha de grupo = o título */
tr.grupo td {
    background:var(--grupo);
    padding:12px 14px; border-top:14px solid var(--bg);
    border-bottom:1px solid var(--line);
}
tr.grupo td:first-child { border-radius:12px 0 0 0; }
tr.grupo td:last-child { border-radius:0 12px 0 0; }
.g-forn { font-size:15.5px; font-weight:800; letter-spacing:-.2px; }
.g-meta { font-size:12px; color:var(--muted); margin-top:1px; }
.g-fatos { display:flex; gap:26px; align-items:center; justify-content:flex-end; flex-wrap:wrap; }
.g-fato { text-align:right; }
.g-fato .k { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:800; }
.g-fato .v { font-size:15px; font-weight:800; white-space:nowrap; }
.g-aprovar { border:none; background:var(--ok); color:#03170e; border-radius:9px;
    padding:9px 18px; font-size:13px; font-weight:800; cursor:pointer; white-space:nowrap;
    transition:transform .12s, box-shadow .15s, background .15s; }
.g-aprovar:hover { background:#6ee7b7; transform:translateY(-1px); box-shadow:0 0 24px rgba(52,211,153,.25); }
.g-aprovar:disabled { background:rgba(255,255,255,.12); color:var(--muted); cursor:default; transform:none; box-shadow:none; }
.g-ok { font-size:12.5px; font-weight:800; color:var(--ok); white-space:nowrap; }
.g-pagto { font-size:12px; color:var(--muted); cursor:pointer; user-select:none; white-space:nowrap; transition:color .15s; }
.g-pagto:hover { color:var(--accent); }

/* linha de detalhe do pagamento (expansível) */
tr.pagto-row td { background:rgba(255,255,255,.02); border-bottom:1px solid var(--line); padding:10px 18px; }
.pagto-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:6px 24px; font-size:12.5px; }
.pagto-grid .k { color:var(--muted); font-size:10.5px; text-transform:uppercase; font-weight:800; }
.pagto-grid .v { font-weight:700; word-break:break-all; }
.pagto-grid .v.mono { font-family:var(--mono); font-size:12px; }
.pagto-grid .ok { color:var(--ok); font-weight:800; }
.pagto-grid .bad { color:var(--crit); font-weight:800; }

/* linhas de apontamento */
tr.apto td {
    background:var(--card); padding:12px 14px;
    border-bottom:1px solid rgba(255,255,255,.05); vertical-align:middle;
    transition:background .12s;
}
tr.apto:hover td { background:rgba(255,255,255,.05); }
tr.apto.decidido td { background:rgba(255,255,255,.015); }
tr.apto.decidido .p-label, tr.apto.decidido .vcell { opacity:.45; }

.p-cell { display:flex; gap:10px; align-items:flex-start; }
.dot { width:10px; height:10px; border-radius:99px; margin-top:6px; flex-shrink:0; }
.dot.CRITICA { background:var(--crit); box-shadow:0 0 0 3px var(--crit-bg), 0 0 12px rgba(248,113,113,.4); }
.dot.ATENCAO { background:var(--warn); box-shadow:0 0 0 3px var(--warn-bg); }
.p-label { font-size:13.5px; font-weight:700; line-height:1.35; }
.p-sub { font-size:11.5px; color:var(--muted); margin-top:2px; }
.nx { font-size:10px; font-weight:800; background:rgba(255,255,255,.07); color:var(--muted);
    border-radius:99px; padding:1px 7px; margin-left:6px; vertical-align:1px; }

.vcell { font-size:13.5px; font-weight:700; white-space:nowrap; }
.vcell.doc-div { color:var(--crit); text-shadow:0 0 18px rgba(248,113,113,.3); }
.vcell .cnpj { font-family:var(--mono); font-size:12px; }
.vazio { color:#3d4148; }

.delta { font-size:12.5px; font-weight:800; color:var(--crit);
    background:var(--crit-bg); border:1px solid rgba(248,113,113,.25); border-radius:8px; padding:4px 10px;
    display:inline-block; white-space:nowrap; }

/* decisão por linha */
.d-cell { display:flex; gap:6px; align-items:center; justify-content:flex-end; }
.d-cell button { border:1px solid var(--line); background:rgba(255,255,255,.04); border-radius:8px;
    width:34px; height:32px; cursor:pointer; font-size:14px; font-weight:800; color:var(--ink);
    transition:background .15s, border-color .15s, transform .12s; }
.d-cell button:hover { transform:translateY(-1px); }
.d-cell .sim { color:var(--ok); } .d-cell .sim:hover { background:var(--ok-bg); border-color:rgba(52,211,153,.35); }
.d-cell .nao { color:var(--crit); } .d-cell .nao:hover { background:var(--crit-bg); border-color:rgba(248,113,113,.35); }
.d-cell .re { color:var(--muted); font-size:12px; width:auto; padding:0 10px; }
.st { font-size:11px; font-weight:800; border-radius:99px; padding:3px 10px; white-space:nowrap; }
.st.APROVADO { background:var(--ok-bg); color:var(--ok); }
.st.REJEITADO { background:rgba(255,255,255,.06); color:var(--muted); }

/* estados vazios / fim */
.fim { text-align:center; padding:80px 20px; }
.fim .emoji { font-size:54px; }
.fim h2 { font-size:24px; margin:12px 0 6px; letter-spacing:-.4px;
    background:linear-gradient(90deg,#fff,#9be8dd);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.fim p { color:var(--muted); }
.fim .acoes { margin-top:20px; display:flex; gap:12px; justify-content:center; }
.fim button { border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--ink); border-radius:12px;
    padding:12px 22px; font-size:14px; font-weight:800; cursor:pointer;
    transition:border-color .15s, transform .12s; }
.fim button:hover { border-color:var(--accent); transform:translateY(-1px); }
.fim .primario { background:var(--accent); color:#04110f; border:none; }
.fim .primario:hover { box-shadow:0 0 28px rgba(20,184,166,.3); }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink);
    color:#0A0A0B; padding:11px 22px; border-radius:10px; font-size:13.5px; font-weight:700; opacity:0;
    transition:opacity .25s; pointer-events:none; z-index:60;
    box-shadow:0 12px 40px rgba(0,0,0,.6); }
.toast.show { opacity:1; }
</style>
</head>
<body>

<div class="topo">
    <select id="sel-exec"></select>
    <div class="prog">
        <div class="barra"><div id="prog-fill"></div></div>
        <span class="txt" id="prog-txt">carregando…</span>
    </div>
    <div class="filtros" id="filtros"></div>
    <input id="busca" placeholder="🔍 Fornecedor, nº do título, problema...">
    <button class="acao" id="bt-rej">⬇ Rejeitados</button>
</div>

<div id="scroll">
    <table>
        <thead><tr>
            <th style="width:34%">Problema</th>
            <th style="width:15%">No Sienge</th>
            <th style="width:15%">No documento</th>
            <th style="width:14%">Diferença</th>
            <th class="c" style="width:12%">Sua decisão</th>
        </tr></thead>
        <tbody id="corpo"></tbody>
    </table>
    <div id="estado-vazio" class="fim" style="display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============ vocabulário curto e claro ============ */
const NOMES = {
    "PAGAMENTO_DESTINO_DIVERGENTE": "Dinheiro vai para outro CNPJ (não é o credor)",
    "CNPJ_DIVERGENTE": "Nota emitida por CNPJ diferente do credor",
    "VALOR_DIVERGENTE": "Valor do título ≠ valor da nota",
    "LIQUIDO_BRUTO_DIVERGENTE": "Líquido não bate com bruto − retenções",
    "LIQUIDO_PARCELA_DIVERGENTE": "Parcela − retenções não bate com o valor a pagar",
    "BOLETO_VALOR_DIVERGENTE": "Boleto cobra valor diferente do título",
    "BOLETO_BANCO_INCOMPATIVEL": "Banco do boleto ≠ forma de pagamento",
    "BOLETO_VENCIMENTO_DIVERGENTE": "Boleto vence em data diferente do título",
    "TRANSFERENCIA_BANCO_INCOMPATIVEL": "TED × depósito: forma errada p/ banco destino",
    "IMPOSTO_DIVERGENTE": "Imposto retido ≠ destacado na nota",
    "IMPOSTO_NF_DIVERGENTE": "Retenção do título ≠ destacada na nota",
    "IMPOSTO_NAO_RETIDO": "Nota destaca retenção não lançada no título",
    "RETENCAO_ALIQUOTA_SUSPEITA": "Alíquota de retenção acima do usual",
    "RETENCAO_INDEVIDA_SIMPLES": "Retenção federal de fornecedor do Simples",
    "CHAVE_NFE_INVALIDA": "Chave de NF-e inválida",
    "BOLETO_NAO_ENCONTRADO": "Boleto não encontrado no DDA",
    "SEM_ANEXO": "Título sem nenhum documento anexado",
    "ANEXO_ILEGIVEL": "Documento não lido (OCR pendente)",
    "PIX_NAO_VERIFICAVEL": "Chave Pix não permite confirmar o titular",
    "PAGAMENTO_FORMA_INCOMPATIVEL": "Forma de pagamento incompatível",
    "FORMA_PAGAMENTO_AUSENTE": "Sem forma de pagamento cadastrada",
    "NF_SEM_CNPJ_DO_CREDOR": "CNPJ do credor não aparece na NF anexada",
    "VENCIMENTO_DIVERGENTE": "Vencimento divergente",
};
const DICAS = {
    "PAGAMENTO_DESTINO_DIVERGENTE": "Exigir cessão de crédito ou autorização do credor",
    "BOLETO_VALOR_DIVERGENTE": "Pedir boleto correto ou ajustar o título",
    "BOLETO_VENCIMENTO_DIVERGENTE": "Pagar após o vencimento do boleto gera juros",
    "LIQUIDO_PARCELA_DIVERGENTE": "Revisar as retenções lançadas",
    "TRANSFERENCIA_BANCO_INCOMPATIVEL": "Corrigir a forma no Sienge — a remessa seria recusada",
    "BOLETO_BANCO_INCOMPATIVEL": "Corrigir a forma no Sienge — a remessa seria recusada",
    "FORMA_PAGAMENTO_AUSENTE": "Sem forma cadastrada o título não entra na remessa",
    "SEM_ANEXO": "Cobrar o documento de quem lançou",
    "PIX_NAO_VERIFICAVEL": "Confirmar a chave com o fornecedor",
    "IMPOSTO_NAO_RETIDO": "Risco de pagar a mais e ficar com o passivo fiscal",
    "NF_SEM_CNPJ_DO_CREDOR": "Abrir o anexo e conferir se a nota é do fornecedor",
    "RETENCAO_INDEVIDA_SIMPLES": "Optante do Simples não sofre retenção federal",
};

/* ============ estado ============ */
let EXEC = null, DIVS = [], PAGS = [], TITULOS = [];
let FILTRO = "PENDENTES", BUSCA = "";
const EXPANDIDOS = new Set();

const $ = id => document.getElementById(id);
const H = () => ({ "Content-Type": "application/json" }); // painel sem login
const dinheiro = v => v == null ? "–" : Number(v).toLocaleString("pt-BR", { style:"currency", currency:"BRL" });
const dig = v => String(v || "").replace(/\D/g, "");
const numDe = s => { const m = String(s ?? "").match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; };
const dataDe = s => { const m = String(s ?? "").match(/\d{4}-\d{2}-\d{2}/); return m ? m[0] : null; };
const dataBR = s => { const m = String(s ?? "").match(/(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (s || ""); };
const cnpjDe = s => { const d = dig(s); return d.length === 14 ? d : null; };
const fmtCNPJ = d => d ? `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}` : "";
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }

/* ============ colunas: No Sienge / No documento / Diferença ============ */
function colunas(d) {
    const S = d.valor_sienge_campo, V = d.valor_boleto_campo && d.valor_boleto_campo !== "-" ? d.valor_boleto_campo
            : (d.valor_nfe_campo && d.valor_nfe_campo !== "-" ? d.valor_nfe_campo : null);
    // dinheiro
    const nS = numDe(S), nV = numDe(V);
    const dS = dataDe(S), dV = dataDe(V);
    const cS = cnpjDe(S), cV = cnpjDe(V);
    if (dS && dV) {
        const dias = Math.round((new Date(dV) - new Date(dS)) / 86400000);
        return { s: dataBR(dS), v: dataBR(dV), diverge: dS !== dV,
                 delta: dias ? Math.abs(dias) + " dia" + (Math.abs(dias) > 1 ? "s" : "") : null };
    }
    if (cS && cV) {
        return { s: `<span class="cnpj">${fmtCNPJ(cS)}</span>`, v: `<span class="cnpj">${fmtCNPJ(cV)}</span>`,
                 diverge: cS !== cV, delta: cS !== cV ? "outro CNPJ" : null };
    }
    if (nS != null && nV != null && /\d\.\d{2}\b/.test(String(S)) && /\d\.\d{2}\b/.test(String(V))) {
        return { s: dinheiro(nS), v: dinheiro(nV), diverge: Math.abs(nS - nV) > 0.05,
                 delta: Math.abs(nS - nV) > 0.05 ? dinheiro(Math.abs(nS - nV)) : null };
    }
    // sem par comparável: mostra o que existir, sem delta
    const fmt1 = x => { const n = numDe(x); return (n != null && /^\d+\.\d{2}$/.test(String(x).trim())) ? dinheiro(n) : (x || null); };
    return { s: fmt1(S), v: fmt1(V), diverge: false, delta: null };
}

/* ============ carga ============ */
async function init() {
    const r = await fetch("/api/execucoes?limit=15", { headers: H() });
    const execs = (await r.json()).filter(e => e.status === "CONCLUIDO");
    const sel = $("sel-exec"); sel.innerHTML = "";
    execs.forEach(e => {
        const o = document.createElement("option");
        o.value = e.id;
        o.textContent = "Ciclo #" + e.id + " · " + (e.iniciado_em || "").replace("T", " ").slice(0, 16);
        sel.appendChild(o);
    });
    sel.onchange = () => carregar(execs.find(e => String(e.id) === sel.value));
    if (execs.length) carregar(execs[0]);
    else $("prog-txt").textContent = "Nenhum ciclo concluído.";
}

async function carregar(exec) {
    EXEC = exec;
    const [d, p] = await Promise.all([
        fetch(`/api/execucoes/${exec.id}/divergencias`, { headers: H() }).then(r => r.json()),
        fetch(`/api/execucoes/${exec.id}/pagamentos`, { headers: H() }).then(r => r.ok ? r.json() : []),
    ]);
    DIVS = d; PAGS = p || [];
    DIVS.forEach(x => { if (!x.status_revisao) x.status_revisao = "PENDENTE"; });
    montar();
    render();
}

function montar() {
    const map = {};
    DIVS.forEach(d => {
        const k = String(d.titulo_numero || "?");
        (map[k] = map[k] || { numero:k, divs:[] }).divs.push(d);
    });
    // inclui TODOS os títulos do ciclo (a tabela de pagamentos tem inclusive os
    // que ficaram OK, sem nenhum apontamento) para poder listar e pesquisar tudo
    PAGS.forEach(p => {
        const k = String(p.titulo_numero || "?");
        if (!map[k]) map[k] = { numero:k, divs:[] };
    });
    TITULOS = Object.values(map).map(t => {
        t.pag = PAGS.find(p => String(p.titulo_numero) === t.numero) || null;
        const d0 = t.divs[0] || {};
        t.fornecedor = d0.fornecedor_nome || t.pag?.fornecedor || "";
        t.cnpj = d0.fornecedor_cnpj || t.pag?.cnpj_credor || "";
        t.valor = d0.valor_sienge ?? t.pag?.valor;
        t.venc = d0.data_vencimento || t.pag?.vencimento || "";
        recontar(t);
        return t;
    });
    TITULOS.sort((a, b) => (b.critPend - a.critPend) || (b.pendentes - a.pendentes) || ((b.valor||0) - (a.valor||0)));
}
function recontar(t) {
    const pend = t.divs.filter(d => d.status_revisao === "PENDENTE");
    t.pendentes = pend.length;
    t.critPend = pend.filter(d => d.criticidade === "CRITICA").length;
    t.aprovados = t.divs.filter(d => d.status_revisao === "APROVADO").length;
    t.rejeitados = t.divs.filter(d => d.status_revisao === "REJEITADO").length;
}
function problemasUnicos(t) {
    t.divs.forEach(d => { d._irmaos = []; });
    const vistos = new Map(), unicos = [];
    t.divs.forEach(d => {
        const k = [d.tipo, d.valor_sienge_campo, d.valor_boleto_campo || d.valor_nfe_campo].join("|");
        if (vistos.has(k)) vistos.get(k)._irmaos.push(d);
        else { vistos.set(k, d); unicos.push(d); }
    });
    unicos.sort((a, b) => (a.criticidade === "CRITICA" ? 0 : 1) - (b.criticidade === "CRITICA" ? 0 : 1));
    return unicos;
}

/* ============ filtros (por TÍTULO) ============ */
const FILTROS = [
    ["PENDENTES", "Pendentes"], ["CRITICAS", "Críticas"], ["ATENCAO", "Atenção"],
    ["OK", "Liberados"], ["DECIDIDOS", "Decididos"], ["TODOS", "Todos"],
];
// Um título aparece no filtro atual?
function tituloNoFiltro(t) {
    switch (FILTRO) {
        case "PENDENTES": return t.pendentes > 0;
        case "CRITICAS":  return t.critPend > 0;
        case "ATENCAO":   return (t.pendentes - t.critPend) > 0;
        case "OK":        return t.divs.length === 0;
        case "DECIDIDOS": return t.divs.length > 0 && t.pendentes === 0;
        default:          return true;  // TODOS
    }
}
// Quais apontamentos mostrar dentro de um título (respeitando o filtro)
function divsDoTitulo(t) {
    const probs = problemasUnicos(t);
    switch (FILTRO) {
        case "PENDENTES": return probs.filter(d => d.status_revisao === "PENDENTE");
        case "CRITICAS":  return probs.filter(d => d.status_revisao === "PENDENTE" && d.criticidade === "CRITICA");
        case "ATENCAO":   return probs.filter(d => d.status_revisao === "PENDENTE" && d.criticidade === "ATENCAO");
        default:          return probs;  // OK / DECIDIDOS / TODOS → todos
    }
}
function contar(f) {
    const antigo = FILTRO; FILTRO = f;
    const n = TITULOS.filter(tituloNoFiltro).length;
    FILTRO = antigo;
    return n;
}
function renderFiltros() {
    const c = $("filtros"); c.innerHTML = "";
    FILTROS.forEach(([f, label]) => {
        const b = document.createElement("button");
        b.className = (FILTRO === f ? "on " : "") + (f === "CRITICAS" ? "fc" : f === "ATENCAO" ? "fw" : "");
        b.innerHTML = `${label} <b>${contar(f)}</b>`;
        b.onclick = () => { FILTRO = f; render(); };
        c.appendChild(b);
    });
}

/* ============ render da tabela ============ */
function render() {
    renderFiltros();
    atualizarProgresso();
    const corpo = $("corpo"); corpo.innerHTML = "";
    const vazio = $("estado-vazio");

    const busca = BUSCA.toLowerCase();
    let linhasVisiveis = 0;

    TITULOS.forEach(t => {
        // Com busca ativa, varre TODOS os títulos (ignora o filtro); sem busca,
        // aplica o filtro selecionado.
        if (busca) {
            const alvo = (t.numero + " " + t.fornecedor + " " + (t.cnpj || "") + " " +
                t.divs.map(d => NOMES[d.tipo] || d.tipo).join(" ")).toLowerCase();
            if (!alvo.includes(busca)) return;
        } else if (!tituloNoFiltro(t)) {
            return;
        }
        const probs = busca ? problemasUnicos(t) : divsDoTitulo(t);
        linhasVisiveis++;

        // ===== linha do título =====
        const tr = document.createElement("tr");
        tr.className = "grupo";
        const estadoDireita = t.divs.length === 0
            ? `<span class="g-ok">✓ liberado</span>`
            : t.pendentes
            ? `<button class="g-aprovar">✓ Aprovar título (${t.pendentes})</button>`
            : (t.rejeitados ? `<span class="g-ok" style="color:var(--muted)">✗ ${t.rejeitados} rejeitado(s)</span>`
                            : `<span class="g-ok">✓ revisado</span>`);
        tr.innerHTML = `
            <td colspan="2">
                <div class="g-forn">${t.fornecedor || "Fornecedor"} <span style="font-weight:600;color:var(--muted)">· ${t.numero}${t.pag?.parcela ? "/" + t.pag.parcela : ""}</span></div>
                <div class="g-meta">${t.cnpj || ""}${t.pag?.regime ? " · " + t.pag.regime : ""} · <span class="g-pagto">💳 dados do pagamento ${EXPANDIDOS.has(t.numero) ? "▴" : "▾"}</span></div>
            </td>
            <td colspan="3">
                <div class="g-fatos">
                    <div class="g-fato"><div class="k">Valor a pagar</div><div class="v">${dinheiro(t.valor)}</div></div>
                    <div class="g-fato"><div class="k">Vencimento</div><div class="v">${dataBR(t.venc)}</div></div>
                    ${t.pag?.forma ? `<div class="g-fato"><div class="k">Forma</div><div class="v" style="font-size:12.5px">${t.pag.forma}</div></div>` : ""}
                    ${estadoDireita}
                </div>
            </td>`;
        const btAp = tr.querySelector(".g-aprovar");
        if (btAp) btAp.onclick = () => decidirTitulo(t, "APROVADO");
        tr.querySelector(".g-pagto").onclick = () => {
            EXPANDIDOS.has(t.numero) ? EXPANDIDOS.delete(t.numero) : EXPANDIDOS.add(t.numero);
            render();
        };
        corpo.appendChild(tr);

        // ===== pagamento expandido =====
        if (EXPANDIDOS.has(t.numero) && t.pag) corpo.appendChild(pagtoRow(t));

        // ===== linhas de problema =====
        probs.forEach(d => corpo.appendChild(aptoRow(d, t)));
    });

    if (!linhasVisiveis) {
        const pend = DIVS.filter(d => d.status_revisao === "PENDENTE").length;
        const filtroPendente = ["PENDENTES", "CRITICAS", "ATENCAO"].includes(FILTRO);
        vazio.style.display = "";
        if (!busca && filtroPendente && pend === 0 && DIVS.length) {
            const apr = DIVS.filter(d => d.status_revisao === "APROVADO").length;
            const rej = DIVS.filter(d => d.status_revisao === "REJEITADO").length;
            vazio.innerHTML = `<div class="emoji">🎉</div><h2>Tudo revisado!</h2>
                <p>${apr} aprovado(s) · ${rej} rejeitado(s). A remessa está liberada.</p>
                <div class="acoes">${rej ? '<button class="primario" onclick="exportarRejeitados()">⬇ Baixar rejeitados</button>' : ""}</div>`;
        } else if (busca) {
            vazio.innerHTML = `<div class="emoji">🔎</div><h2>Nenhum título encontrado</h2><p>Nada bate com “${BUSCA}”.</p>`;
        } else {
            vazio.innerHTML = `<div class="emoji">🔎</div><h2>Nada aqui</h2><p>Nenhum título com esse filtro.</p>`;
        }
    } else vazio.style.display = "none";
}

function aptoRow(d, t) {
    const st = d.status_revisao;
    const tr = document.createElement("tr");
    tr.className = "apto" + (st !== "PENDENTE" ? " decidido" : "");
    const c = colunas(d);
    const nx = d._irmaos?.length ? `<span class="nx" title="confirmado por ${d._irmaos.length + 1} verificações">${d._irmaos.length + 1}×</span>` : "";
    const dica = DICAS[d.tipo] ? `<div class="p-sub">→ ${DICAS[d.tipo]}</div>` : "";

    const acoes = st === "PENDENTE"
        ? `<button class="sim" title="Aprovar">✓</button><button class="nao" title="Rejeitar">✗</button>`
        : `<span class="st ${st}">${st === "APROVADO" ? "✓ aprovado" : "✗ rejeitado"}</span><button class="re" title="Reabrir">↩</button>`;

    tr.innerHTML = `
        <td><div class="p-cell"><span class="dot ${d.criticidade}"></span>
            <div><div class="p-label">${NOMES[d.tipo] || d.tipo}${nx}</div>${dica}</div></div></td>
        <td><span class="vcell">${c.s || '<span class="vazio">—</span>'}</span></td>
        <td><span class="vcell ${c.diverge ? "doc-div" : ""}">${c.v || '<span class="vazio">—</span>'}</span></td>
        <td>${c.delta ? `<span class="delta">${c.delta}</span>` : '<span class="vazio">—</span>'}</td>
        <td><div class="d-cell">${acoes}</div></td>`;

    const sim = tr.querySelector(".sim"), nao = tr.querySelector(".nao"), re = tr.querySelector(".re");
    if (sim) sim.onclick = () => decidir(d, t, "APROVADO");
    if (nao) nao.onclick = () => decidir(d, t, "REJEITADO");
    if (re) re.onclick = () => decidir(d, t, "PENDENTE");
    return tr;
}

function pagtoRow(t) {
    const p = t.pag;
    const tr = document.createElement("tr");
    tr.className = "pagto-row";
    const c1 = dig(p.cnpj_credor), c2 = dig(p.cnpj_destino);
    const itens = [];
    const item = (k, v, mono) => v && itens.push(`<div><div class="k">${k}</div><div class="v ${mono ? "mono" : ""}">${v}</div></div>`);
    item("Forma", p.forma);
    item("Valor da parcela (bruto)", p.valor != null ? dinheiro(p.valor) : null);
    item("Chave Pix" + (p.tipo_chave_pix ? " (" + p.tipo_chave_pix + ")" : ""), p.chave_pix);
    item("Banco · Ag · Conta", [p.banco, p.agencia, p.conta].filter(Boolean).join(" · "));
    item("Titular", p.titular);
    item("CNPJ destino", p.cnpj_destino ? p.cnpj_destino + (c1 && c2 ? (c1 === c2
        ? ' <span class="ok">✓ é o credor</span>' : ' <span class="bad">✗ não é o credor</span>') : "") : null);
    item("Linha digitável", p.linha_digitavel, true);
    item("Banco do boleto", p.banco_boleto);
    item("Valor do boleto", p.valor_boleto != null ? dinheiro(p.valor_boleto) : null);
    if (p.retencoes) { try {
        const r = JSON.parse(p.retencoes);
        item("Retenções", Object.entries(r).map(([k, v]) => `${k} ${dinheiro(v)}`).join(" · "));
    } catch (e) {} }
    if (p.liquido_calc != null) {
        const bate = Math.abs(p.liquido_calc - (t.valor || 0)) <= 0.05;
        item("Líquido calculado", dinheiro(p.liquido_calc) + (bate ? ' <span class="ok">✓ bate com o fluxo</span>' : ` <span class="bad">✗ fluxo ${dinheiro(t.valor)}</span>`));
    }
    item("Regime", p.regime);
    tr.innerHTML = `<td colspan="5"><div class="pagto-grid">${itens.join("")}</div></td>`;
    return tr;
}

/* ============ ações ============ */
async function post(d, status) {
    const alvos = [d, ...(d._irmaos || [])];
    for (const a of alvos) {
        const r = await fetch("/api/divergencias/" + a.id + "/revisao", {
            method: "POST", headers: H(),
            body: JSON.stringify({ status, observacao: a.observacao_revisao || null }),
        });
        if (!r.ok) throw 0;
        Object.assign(a, await r.json());
    }
}
async function decidir(d, t, status) {
    try {
        await post(d, status);
        recontar(t);
        if (status !== "PENDENTE") toast(status === "APROVADO" ? "Aprovado ✓" : "Rejeitado ✗");
        render();
    } catch { toast("Erro ao salvar — verifique o login."); }
}
async function decidirTitulo(t, status) {
    const agrupados = new Set();
    t.divs.forEach(d => (d._irmaos || []).forEach(x => agrupados.add(x)));
    const pend = t.divs.filter(d => d.status_revisao === "PENDENTE" && !agrupados.has(d));
    try {
        for (const d of pend) await post(d, status);
        recontar(t);
        toast((status === "APROVADO" ? "✔ Título " : "✖ Título ") + t.numero + " concluído");
        render();
    } catch { toast("Erro ao salvar — verifique o login."); }
}

function atualizarProgresso() {
    const total = DIVS.length;
    const feitos = DIVS.filter(d => d.status_revisao !== "PENDENTE").length;
    const crit = DIVS.filter(d => d.status_revisao === "PENDENTE" && d.criticidade === "CRITICA").length;
    const pct = total ? Math.round(100 * feitos / total) : 0;
    $("prog-fill").style.width = pct + "%";
    $("prog-txt").innerHTML = `<b>${feitos}</b>/${total} revisados` +
        (crit ? ` · <b style="color:var(--crit)">${crit} críticas</b>` : " · ✓");
}

/* ============ exportar / busca ============ */
$("bt-rej").onclick = exportarRejeitados;
async function exportarRejeitados() {
    if (!EXEC) return;
    const n = DIVS.filter(d => d.status_revisao === "REJEITADO").length;
    if (!n) return toast("Nada rejeitado neste ciclo ainda.");
    const r = await fetch(`/api/execucoes/${EXEC.id}/revisao/relatorio?status=REJEITADO`, { headers: H() });
    if (!r.ok) return toast("Erro ao gerar o relatório.");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob());
    a.download = "rejeitados_ciclo" + EXEC.id + ".xlsx";
    a.click();
    toast(n + " rejeitado(s) exportados ⬇");
}
$("busca").addEventListener("input", e => { BUSCA = e.target.value; render(); });

init();
</script>
