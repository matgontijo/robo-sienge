# Deploy no Render — banco Postgres compartilhado + painel web.
# O ciclo pesado (7 min, credenciais Sienge) roda LOCAL no PC 1x/semana e grava
# neste mesmo Postgres; o painel na nuvem lê e escreve as aprovações no MESMO
# banco, então local e nuvem enxergam exatamente os mesmos dados.
databases:
  - name: robo-sienge-db
    plan: basic-256mb            # menor Postgres pago (~US$6/mês). Troque p/ "free" p/ testar.
    databaseName: robo_sienge
    user: robo

services:
  - type: web
    name: robo-sienge-painel
    runtime: python
    plan: free                  # o painel pode ser grátis: os dados moram no Postgres,
                                # não na instância. Hibernar só causa cold start (~30s).
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py dashboard
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robo-sienge-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
      # Login: o admin master é DASHBOARD_USER/DASHBOARD_PASSWORD (defina no Render).
      - key: DASHBOARD_USER
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      # IA na nuvem = modo worker: o painel só enfileira; quem pensa é a SUA máquina
      # rodando `python agente_worker.py` com o MESMO AGENTE_WORKER_TOKEN.
      - key: AGENTE_MODO
        value: nuvem
      - key: AGENTE_WORKER_TOKEN
        generateValue: true
      # SIENGE/GEMINI não são necessários na nuvem: o ciclo e o agente rodam local.
