# Deploy no Render — banco Postgres compartilhado + painel web.
# O ciclo pesado (7 min, credenciais Sienge) roda LOCAL no PC 1x/semana e grava
# neste mesmo Postgres; o painel na nuvem lê e escreve as aprovações no MESMO
# banco, então local e nuvem enxergam exatamente os mesmos dados.
databases:
  - name: robo-sienge-db
    plan: basic-256mb            # menor Postgres pago (~US$6/mês). Troque p/ "free" p/ testar.
    databaseName: robo_sienge
    user: robo

services:
  - type: web
    name: robo-sienge-painel
    runtime: python
    plan: free                  # o painel pode ser grátis: os dados moram no Postgres,
                                # não na instância. Hibernar só causa cold start (~30s).
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py dashboard
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: robo-sienge-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
      # ATENÇÃO: o painel NÃO tem mais login. Publicar na nuvem deixa os dados
      # financeiros abertos a qualquer pessoa com a URL — se voltar a usar o
      # Render, proteja o serviço por fora (ex.: Cloudflare Access / IP allowlist).
      # SIENGE/GEMINI só são necessários se um dia o ciclo rodar na nuvem;
      # como o ciclo fica local, o painel na nuvem NÃO precisa deles.
